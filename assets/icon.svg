<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E28" />
      <stop offset="50%" stop-color="#0F1720" />
      <stop offset="100%" stop-color="#080C10" />
    </linearGradient>

    <!-- Outer Glow / Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Screen Bezel Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B131B" />
      <stop offset="100%" stop-color="#04070A" />
    </linearGradient>

    <!-- Eye Glow Gradient -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="40%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Antenna Signal Gradient -->
    <linearGradient id="signalGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadows and Glows -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="chassisShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Chassis -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="8" filter="url(#chassisShadow)" />

  <!-- Corner Tech Accents -->
  <path d="M 64 120 L 64 64 L 120 64" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <path d="M 448 120 L 448 64 L 392 64" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <path d="M 64 392 L 64 448 L 120 448" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <path d="M 448 392 L 448 448 L 392 448" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" opacity="0.6" />

  <!-- ESP32 Wireless Waves / Neural Antenna -->
  <g opacity="0.85" transform="translate(0, -6)">
    <path d="M 206 90 Q 256 62 306 90" fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" />
    <path d="M 226 112 Q 256 94 286 112" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round" />
    <circle cx="256" cy="132" r="5" fill="#34D399" filter="url(#neonGlow)" />
  </g>

  <!-- OLED Display Screen -->
  <rect x="76" y="152" width="360" height="264" rx="44" fill="url(#screenGrad)" stroke="#1E293B" stroke-width="4" />
  <!-- Screen Grid Scanlines (Subtle Cyber Aesthetic) -->
  <path d="M 80 200 H 432 M 80 248 H 432 M 80 296 H 432 M 80 344 H 432 M 80 392 H 432" stroke="#22D3EE" stroke-opacity="0.04" stroke-width="2" />

  <!-- Expressive Companion OLED Eyes (Glowing Cybernetic Face) -->
  <g filter="url(#neonGlow)">
    <!-- Left Eye (Dynamic Rounded Capsule) -->
    <rect x="136" y="214" width="76" height="116" rx="38" fill="url(#eyeGrad)" />
    <!-- Left Eye Highlight / Glint -->
    <circle cx="158" cy="242" r="10" fill="#FFFFFF" opacity="0.9" />
    <circle cx="180" cy="294" r="5" fill="#FFFFFF" opacity="0.6" />

    <!-- Right Eye (Dynamic Rounded Capsule) -->
    <rect x="300" y="214" width="76" height="116" rx="38" fill="url(#eyeGrad)" />
    <!-- Right Eye Highlight / Glint -->
    <circle cx="322" cy="242" r="10" fill="#FFFFFF" opacity="0.9" />
    <circle cx="344" cy="294" r="5" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- Interactive Smile / Sensor Status Bar -->
  <g transform="translate(0, 8)">
    <path d="M 216 352 Q 256 376 296 352" fill="none" stroke="url(#eyeGrad)" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)" />
  </g>

  <!-- Circuit Trace Micro-Dots (Bottom) -->
  <circle cx="180" cy="448" r="4" fill="#22D3EE" opacity="0.5" />
  <line x1="180" y1="448" x2="220" y2="448" stroke="#22D3EE" stroke-width="2" opacity="0.4" />
  <circle cx="220" cy="448" r="3" fill="#10B981" opacity="0.6" />

  <circle cx="332" cy="448" r="4" fill="#22D3EE" opacity="0.5" />
  <line x1="332" y1="448" x2="292" y2="448" stroke="#22D3EE" stroke-width="2" opacity="0.4" />
  <circle cx="292" cy="448" r="3" fill="#10B981" opacity="0.6" />
</svg>
